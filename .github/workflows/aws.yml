# Optional Amazon ECS deploy — MANUAL ONLY.
#
# The Vite MVP web prototype does not need AWS/ECS. The previous GitHub
# "Deploy to Amazon ECS" starter used MY_* placeholders and failed every push
# to main with: Region is not valid: MY_AWS_REGION.
#
# This workflow no longer runs on push or pull_request. Enable it later via
# Actions → "Deploy to Amazon ECS (manual)" → Run workflow, after filling
# repository Variables + Secrets below.
#
# Required repository Variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION              e.g. us-west-2
#   ECR_REPOSITORY          ECR repository name
#   ECS_SERVICE             ECS service name
#   ECS_CLUSTER             ECS cluster name
#   ECS_TASK_DEFINITION     path to task-definition JSON in this repo
#   CONTAINER_NAME          container name inside that task definition
#
# Required repository Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Also needed in-repo: Dockerfile + task definition JSON (not part of MVP).

name: Deploy to Amazon ECS (manual)

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify AWS deploy configuration
        run: |
          missing=0
          for name in AWS_REGION ECR_REPOSITORY ECS_SERVICE ECS_CLUSTER ECS_TASK_DEFINITION CONTAINER_NAME; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. Add it under repository Variables before running this workflow."
              missing=1
            else
              echo "$name is set"
            fi
          done
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are required."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "ECS deploy is optional for the MVP web prototype. Configure vars/secrets only when you are ready to ship to AWS."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
